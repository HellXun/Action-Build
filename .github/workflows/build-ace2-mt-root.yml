name: Build Ace2 MT Root Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save Patch Outside Workspace
        run: |
          cp patches/0001-mt-root.patch /tmp/0001-mt-root.patch
          cp patches/oneplus_ace2_b_mirror.xml /tmp/oneplus_ace2_b_mirror.xml

      - name: Maximize Build Space
        env:
          ROOT_RESERVE_MB: '8192'
          TEMP_RESERVE_MB: '2048'
          REMOVE_DOTNET: 'true'
          REMOVE_ANDROID: 'true'
          REMOVE_HASKELL: 'true'
          REMOVE_CODEQL: 'true'
        run: bash scripts/maximize-build-space.sh

      - name: Install Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y python3 git curl bc libelf-dev build-essential \
            flex bison libssl-dev libncurses-dev lz4 zlib1g-dev libxml2-utils \
            rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves ccache patch
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo
          git config --global user.name "ace2-builder"
          git config --global user.email "ace2-builder@local"
          git config --global color.ui false

      - name: Initialize Repo and Sync
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -e
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/sm8475 -m oneplus_ace2_b.xml \
            --depth=1 --no-clone-bundle --no-tags
          # 官方清单里的 CLO remote 在 GitHub Runner 上不可达，换成镜像清单
          cp /tmp/oneplus_ace2_b_mirror.xml .repo/manifests/oneplus_ace2_b.xml
          for i in 1 2 3; do
            echo "==== repo sync 第 $i 次 ===="
            if repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags --force-sync; then
              break
            fi
            [ "$i" = "3" ] && exit 1
            sleep 20
          done
          df -h

      - name: Fetch clang-r416183b from AOSP Mirror
        run: |
          set -e
          git clone --depth=1 --filter=blob:none --sparse --branch android-12.0.0_r1 \
            https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/prebuilts/clang/host/linux-x86 /tmp/aosp-clang
          cd /tmp/aosp-clang
          git sparse-checkout set clang-r416183b
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86"
          cp -a clang-r416183b \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/"
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang" --version
          df -h

      - name: Apply MT Root Patch
        run: |
          set -e
          cd kernel_workspace
          for d in kernel_platform/msm-kernel kernel_platform/common; do
            if [ -f "$d/kernel/cred.c" ] && [ -f "$d/fs/exec.c" ]; then
              echo "==== patching $d ===="
              if (cd "$d" && git apply --check /tmp/0001-mt-root.patch); then
                (cd "$d" && git apply /tmp/0001-mt-root.patch)
              else
                echo "git apply 上下文不匹配，改用 patch -F3"
                (cd "$d" && patch -p1 --forward --fuzz=3 < /tmp/0001-mt-root.patch)
              fi
              grep -n '10345' "$d/kernel/cred.c" "$d/fs/exec.c"
              grep -n 'enforcing_set(&selinux_state, 0)' "$d/security/selinux/hooks.c"
              grep -n 'enforcing_enabled(state)' "$d/security/selinux/avc.c"
            fi
          done

      - name: Align Kernel Release String
        run: |
          set -e
          python3 scripts/align-kernel-release.py \
            kernel_workspace/kernel_platform/common/scripts/setlocalversion \
            kernel_workspace/kernel_platform/msm-kernel/scripts/setlocalversion

      - name: Build Kernel and Images
        run: |
          set -e
          cd kernel_workspace
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh waipio gki

      - name: Collect Artifacts
        run: |
          set -e
          mkdir -p artifacts
          cd kernel_workspace/kernel_platform
          DIST=""
          for d in out/msm-waipio-waipio-gki/dist out/*/dist; do
            [ -d "$d" ] && DIST="$d" && break
          done
          [ -n "$DIST" ] || { echo "找不到 dist 目录"; find out -maxdepth 3 -type d | head -40; exit 1; }
          echo "DIST=$DIST"
          ls -lh "$DIST"
          for f in boot.img vendor_boot.img vendor_dlkm.img dtbo.img Image Image.lz4; do
            [ -f "$DIST/$f" ] && cp "$DIST/$f" "$GITHUB_WORKSPACE/artifacts/"
          done
          find out -name kernel.release -exec cp {} "$GITHUB_WORKSPACE/artifacts/kernel.release" \; || true
          [ -f "$DIST/.config" ] && cp "$DIST/.config" "$GITHUB_WORKSPACE/artifacts/kernel.config" || true
          cat "$GITHUB_WORKSPACE/artifacts/kernel.release" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: ace2-mt-root-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
